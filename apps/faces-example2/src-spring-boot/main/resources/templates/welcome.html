      layout:decorate="~{layout/base}">
<head>
    <title th:text="#{index.title}">MailReader Demonstration Application</title>
</head>
<body>
    <div layout:fragment="menu">
        <div th:replace="~{fragments/loggedoff-menu :: menu}"></div>
    </div>

    <div layout:fragment="content">
        <h3 th:text="#{index.heading}">MailReader Demonstration Application Options</h3>
        <ul>
            <li><a th:href="@{/editRegistration(action='Create')}" th:text="#{index.registration}">Register with the MailReader Demonstration Application</a></li>
            <li><a th:href="@{/editLogon}" th:text="#{index.logon}">Log on to the MailReader Demonstration Application</a></li>
        </ul>
    </div>

</html>
