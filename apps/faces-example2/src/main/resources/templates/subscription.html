<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title th:switch="${subscriptionForm.action}">
        <span th:case="'Create'" th:text="#{subscription.title.create}">Create New Mail Subscription</span>
        <span th:case="'Delete'" th:text="#{subscription.title.delete}">Delete Existing Mail Subscription</span>
        <span th:case="'Edit'" th:text="#{subscription.title.edit}">Edit Existing Mail Subscription</span>
        <span th:case="*">Mail Subscription</span>
    </title>
</head>
<body>
    <div layout:fragment="menu">
        <div th:if="${user != null}" th:replace="~{fragments/loggedon-menu :: menu}"></div>
        <div th:if="${user == null}" th:replace="~{fragments/loggedoff-menu :: menu}"></div>
    </div>

    <div layout:fragment="content">
        <form th:action="@{/saveSubscription}" th:object="${subscriptionForm}" method="post">
            <div th:if="${#fields.hasGlobalErrors()}" class="error">
                <ul>
                    <li th:each="err : ${#fields.globalErrors()}" th:text="${err}">Global Error</li>
                </ul>
                <hr/>
            </div>
            <input type="hidden" th:field="*{action}"/>

            <table class="form-background">
                <thead>
                    <tr class="form-header">
                        <th colspan="2">
                            <span th:if="${subscriptionForm.action == 'Create'}" th:text="#{subscription.title.create}">Create New Mail Subscription</span>
                            <span th:if="${subscriptionForm.action == 'Delete'}" th:text="#{subscription.title.delete}">Delete Existing Mail Subscription</span>
                            <span th:if="${subscriptionForm.action == 'Edit'}" th:text="#{subscription.title.edit}">Edit Existing Mail Subscription</span>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="form-prompt">
                            <label th:text="#{prompt.username}">Username</label>
                        </td>
                        <td class="form-field">
                            <span th:text="${user.username}">username</span>
                        </td>
                    </tr>

                    <tr>
                        <td class="form-prompt">
                            <label for="host" th:text="#{prompt.mailHostname}">Mail Server</label>
                        </td>
                        <td class="form-field">
                            <span th:if="${subscriptionForm.action == 'Create'}">
                                <input type="text" th:field="*{host}" size="50" id="host" autofocus="autofocus"/>
                            </span>
                            <span th:if="${subscriptionForm.action != 'Create'}">
                                <span th:text="*{host}">mail.example.com</span>
                                <input type="hidden" th:field="*{host}"/>
                            </span>
                            <span th:if="${#fields.hasErrors('host')}" class="error">
                                <span th:errors="*{host}">Host error</span>
                            </span>
                        </td>
                    </tr>

                    <tr>
                        <td class="form-prompt">
                            <label for="username" th:text="#{prompt.mailUsername}">Mail Username</label>
                        </td>
                        <td class="form-field">
                            <span th:if="${subscriptionForm.action != 'Delete'}">
                                <input type="text" th:field="*{username}" size="50" id="username"/>
                            </span>
                            <span th:if="${subscriptionForm.action == 'Delete'}">
                                <span th:text="*{username}">mailuser</span>
                                <input type="hidden" th:field="*{username}"/>
                            </span>
                            <span th:if="${#fields.hasErrors('username')}" class="error">
                                <span th:errors="*{username}">Username error</span>
                            </span>
                        </td>
                    </tr>

                    <tr>
                        <td class="form-prompt">
                            <label for="password" th:text="#{prompt.mailPassword}">Mail Password</label>
                        </td>
                        <td class="form-field">
                            <span th:if="${subscriptionForm.action != 'Delete'}">
                                <input type="password" th:field="*{password}" size="50" id="password"/>
                            </span>
                            <span th:if="${subscriptionForm.action == 'Delete'}">
                                <span>********</span>
                                <input type="hidden" th:field="*{password}"/>
                            </span>
                        </td>
                    </tr>

                    <tr>
                        <td class="form-prompt">
                            <label for="type" th:text="#{prompt.mailServerType}">Server Type</label>
                        </td>
                        <td class="form-field">
                            <span th:if="${subscriptionForm.action != 'Delete'}">
                                <select th:field="*{type}" id="type">
                                    <option th:each="serverType : ${serverTypes}"
                                            th:value="${serverType.value}"
                                            th:text="${serverType.label}">Protocol</option>
                                </select>
                            </span>
                            <span th:if="${subscriptionForm.action == 'Delete'}">
                                <span th:text="*{type}">imap</span>
                                <input type="hidden" th:field="*{type}"/>
                            </span>
                            <span th:if="${#fields.hasErrors('type')}" class="error">
                                <span th:errors="*{type}">Type error</span>
                            </span>
                        </td>
                    </tr>

                    <tr>
                        <td class="form-prompt">
                            <label for="autoConnect" th:text="#{prompt.autoConnect}">Auto Connect</label>
                        </td>
                        <td class="form-field">
                            <span th:if="${subscriptionForm.action != 'Delete'}">
                                <input type="checkbox" th:field="*{autoConnect}" id="autoConnect"/>
                            </span>
                            <span th:if="${subscriptionForm.action == 'Delete'}">
                                <span th:text="*{autoConnect}">false</span>
                                <input type="hidden" th:field="*{autoConnect}"/>
                            </span>
                        </td>
                    </tr>

                    <tr>
                        <td class="form-prompt">
                            <button th:if="${subscriptionForm.action == 'Delete'}" type="submit" class="command-single" th:text="#{button.confirm}">Confirm</button>
                            <button th:if="${subscriptionForm.action != 'Delete'}" type="submit" class="command-single" th:text="#{button.save}">Save</button>
                        </td>
                        <td class="form-field">
                            <button type="reset" class="command-multiple" th:text="#{button.reset}">Reset</button>
                            <button type="submit" name="cancel" value="cancel" class="command-multiple" th:text="#{button.cancel}">Cancel</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </form>
    </div>
</body>
</html>
