<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Logged Off Menu Fragment</title>
</head>
<body>
    <div th:fragment="menu">
        <table>
            <tr>
                <td>
                    <a th:href="@{/editRegistration(action='Create')}" th:text="#{loggedoff.register}">Register</a>
                </td>
            </tr>
            <tr>
                <td>
                    <a th:href="@{/logon}" th:text="#{loggedoff.logon}">Log On</a>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
